databaseChangeLog:
  - changeSet:
      id: 6-create-student-group-table
      author: serj
      changes:
        - createTable:
            tableName: student_group
            columns:
              - column:
                  name: student_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: group_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addPrimaryKey:
            tableName: student_group
            columnNames: student_id, group_id
            constraintName: pk_student_group
        - addForeignKeyConstraint:
            baseTableName: student_group
            baseColumnNames: student_id
            referencedTableName: students
            referencedColumnNames: id
            constraintName: fk_sg_student
        - addForeignKeyConstraint:
            baseTableName: student_group
            baseColumnNames: group_id
            referencedTableName: groups
            referencedColumnNames: id
            constraintName: fk_sg_group